<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0d1124" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>

    <!-- Shield & Accent Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
    </filter>

    <!-- Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#312e81" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1" fill="#6366f1" fill-opacity="0.4" />
    </pattern>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Animated Glowing Orbs in Background -->
  <circle cx="150" cy="90" r="120" fill="#6366f1" opacity="0.25">
    <animate attributeName="opacity" values="0.18;0.32;0.18" dur="6s" repeatCount="indefinite" />
    <animate attributeName="r" values="110;130;110" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="980" cy="210" r="150" fill="#a855f7" opacity="0.2">
    <animate attributeName="opacity" values="0.15;0.28;0.15" dur="7s" repeatCount="indefinite" />
    <animate attributeName="r" values="140;165;140" dur="7s" repeatCount="indefinite" />
  </circle>
  <circle cx="650" cy="380" r="100" fill="#ec4899" opacity="0.16">
    <animate attributeName="opacity" values="0.12;0.24;0.12" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Dynamic Cyber Grid & Shield Vector Art (Right Side) -->
  <g transform="translate(0, 0)">
    <!-- Concentric radar circles with animate -->
    <circle cx="980" cy="210" r="140" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="8 6">
      <animateTransform attributeName="transform" type="rotate" from="0 980 210" to="360 980 210" dur="40s" repeatCount="indefinite" />
    </circle>
    <circle cx="980" cy="210" r="100" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.4" />
    <circle cx="980" cy="210" r="60" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="6 4">
      <animateTransform attributeName="transform" type="rotate" from="360 980 210" to="0 980 210" dur="25s" repeatCount="indefinite" />
    </circle>
    <circle cx="980" cy="210" r="165" fill="none" stroke="#ec4899" stroke-width="1" stroke-opacity="0.25">
      <animate attributeName="r" values="140;175;140" dur="4s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.35;0.05;0.35" dur="4s" repeatCount="indefinite" />
    </circle>

    <!-- Central Tech Shield -->
    <path d="M 980 120 L 1050 155 L 1050 230 C 1050 280 980 310 980 310 C 980 310 910 280 910 230 L 910 155 Z" 
          fill="#0c1027" stroke="url(#shieldGrad)" stroke-width="3.5" filter="url(#glow)">
      <animate attributeName="stroke-width" values="3;4.5;3" dur="3s" repeatCount="indefinite" />
    </path>
    
    <!-- Shield Internal Padlock / AI Core -->
    <path d="M 965 200 L 965 185 C 965 176.7 971.7 170 980 170 C 988.3 170 995 176.7 995 185 L 995 200" 
          fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <rect x="955" y="200" width="50" height="40" rx="8" fill="url(#shieldGrad)" />
    <circle cx="980" cy="218" r="4" fill="#ffffff" />
    <path d="M 980 222 L 980 231" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

    <!-- Orbiting Defense Particles -->
    <circle cx="1065" cy="180" r="4" fill="#38bdf8">
      <animate attributeName="cy" values="180;170;180" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="895" cy="250" r="5" fill="#f43f5e">
      <animate attributeName="cy" values="250;260;250" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="1010" cy="315" r="4" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Flowing Circuit Interconnect Lines -->
  <path d="M 680 160 L 780 160 L 820 200 L 910 200" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="8 6" />
  <path d="M 720 280 L 800 280 L 850 240 L 910 240" fill="none" stroke="#ec4899" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="8 6" />

  <!-- Content Group (Foreground: Crisp, Clear & Completely Visible) -->
  <g transform="translate(80, 0)">
    
    <!-- Category Super-Header / Pill -->
    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="380" height="34" rx="17" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.7" />
      <circle cx="18" cy="17" r="6" fill="#10b981" />
      <text x="34" y="22" fill="#e0e7ff" class="badge-text">🛡️ ENTERPRISE &amp; OPEN-SOURCE AI DEFENSE</text>
    </g>

    <!-- Main Title (Gradient Fill + High Contrast Shadow) -->
    <text x="0" y="160" fill="url(#cyberCyan)" class="title-text" font-size="44" filter="url(#softGlow)">
      Awesome AI Jailbreak Testing
    </text>
    <text x="0" y="212" fill="#ffffff" class="title-text" font-size="44">
      &amp; Prompt Security Ecosystem
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="260" fill="#94a3b8" class="sub-text" font-size="17">
      The authoritative index for Automated LLM Red-Teaming, Prompt Injection Defense,
    </text>
    <text x="0" y="286" fill="#cbd5e1" class="sub-text" font-size="17">
      Runtime AI Security Firewalls, Guardrails &amp; Adversarial Robustness Audits.
    </text>

    <!-- Feature Tags / Metric Pills -->
    <g transform="translate(0, 325)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="168" height="36" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="14" y="23" fill="#38bdf8" class="badge-text">⚡ RED-TEAMING</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="180" height="36" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="14" y="23" fill="#a855f7" class="badge-text">🛡️ AI FIREWALLS</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(372, 0)">
        <rect x="0" y="0" width="190" height="36" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="14" y="23" fill="#ec4899" class="badge-text">🔍 JAILBREAK BENCH</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(574, 0)">
        <rect x="0" y="0" width="170" height="36" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="14" y="23" fill="#10b981" class="badge-text">📊 SAAS &amp; OSS</text>
      </g>
    </g>
  </g>

  <!-- Bottom Cyber Accent Border -->
  <rect x="0" y="415" width="1200" height="5" fill="url(#shieldGrad)" />
</svg>
